name: Release

on:
  push:
    tags:
      - 'v*'

# 1 つのタグ（例: v1.3.0）で全 Minecraft バージョンの jar をビルドし、1 つのリリースにまとめる。
# jar 名の "+mc1.19.4" 等でアップデートチェッカーが自分の系統の jar を選ぶ。
# 1.1.29 以前のチェッカーは最初の jar を無条件に取るので、1.19.4 の jar を先にアップロードする。

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches mod.version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION=$(grep -E '^mod\.version\s*=' stonecutter.properties.toml | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          if [ "$VERSION" != "$MOD_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod.version=$MOD_VERSION in stonecutter.properties.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Loom
        uses: actions/cache@v4
        with:
          path: |
            .gradle/loom-cache
            versions/*/.gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'stonecutter.gradle.kts', 'stonecutter.properties.toml', 'gradle.properties') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Build all versions
        run: ./gradlew chiseledBuild

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          ARGS=(-f tag_name="$GITHUB_REF_NAME")
          if [ -n "$PREVIOUS" ]; then
            ARGS+=(-f previous_tag_name="$PREVIOUS")
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AST-Tweaks v${{ steps.version.outputs.version }}"
          files: build/libs/ast-tweaks-${{ steps.version.outputs.version }}+mc1.19.4.jar
          body_path: release-notes.md
          make_latest: true

      - name: Upload jars for the other Minecraft versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for jar in build/libs/ast-tweaks-${{ steps.version.outputs.version }}+mc*.jar; do
            case "$jar" in *+mc1.19.4.jar|*-sources.jar) continue ;; esac
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          done
