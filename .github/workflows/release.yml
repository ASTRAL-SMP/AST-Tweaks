name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Loom がプロジェクト内に作る Access Widener 適用済み Minecraft と remap 済み mod。
      # setup-gradle は ~/.gradle しかキャッシュしないため、これが無いと毎回作り直しになる
      - name: Cache Loom
        uses: actions/cache@v4
        with:
          path: .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'src/main/resources/*.accesswidener') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Build
        run: ./gradlew build

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AST-Tweaks v${{ steps.version.outputs.version }}"
          files: build/libs/ast-tweaks-${{ steps.version.outputs.version }}.jar
          generate_release_notes: true
