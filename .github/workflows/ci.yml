name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Loom がプロジェクト内に作る Access Widener 適用済み Minecraft と remap 済み mod。
      # setup-gradle は ~/.gradle しかキャッシュしないため、これが無いと毎回作り直しになる
      - name: Cache Loom
        uses: actions/cache@v4
        with:
          path: .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'src/main/resources/*.accesswidener') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Build
        run: ./gradlew build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*.jar
          retention-days: 7
