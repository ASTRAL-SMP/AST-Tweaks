name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 26.x のコンパイルに JDK 25 が要る。1.19.4 / 1.20.1 は同じ JDK で --release 17 にしている
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Loom がプロジェクト内に作る remap 済み mod のキャッシュ（バージョンごと）。
      # setup-gradle は ~/.gradle しかキャッシュしないため、これが無いと毎回作り直しになる
      - name: Cache Loom
        uses: actions/cache@v4
        with:
          path: |
            .gradle/loom-cache
            versions/*/.gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'stonecutter.gradle.kts', 'stonecutter.properties.toml', 'gradle.properties') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Build all versions
        run: ./gradlew chiseledBuild

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*.jar
          retention-days: 7
